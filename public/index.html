<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` põe a página sob o notch; o CSS devolve o espaço com env(safe-area-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <title>scratch board</title>
    <!-- Uma folha por assunto, em vários `<link>` — o navegador as busca em paralelo.
         `@import` dentro de um CSS seria serial (cada folha só é descoberta depois que a
         anterior chega), e sem bundler não há quem as junte.

         A ordem abaixo **é** a cascata: `base` primeiro, porque é dele que todas as
         outras leem os tokens; `shell` (a moldura) e `components` (o que reaparece em
         mais de uma tela) na sequência; depois as folhas de cada painel, na ordem em que
         se sobrepõem — `tree` (a árvore, painel esquerdo), `viewer` (o arquivo cru),
         `markdown` (o `.md` renderizado, dentro do viewer) e `graph` (o grafo de uma
         pasta). Mexer na ordem é mexer no desempate entre regras de mesma
         especificidade — não é decoração. -->

    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/tree.css" />
    <link rel="stylesheet" href="/css/viewer.css" />
    <link rel="stylesheet" href="/css/markdown.css" />
    <link rel="stylesheet" href="/css/graph.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>"
    />
  </head>
  <body>
    <!-- `shell.js` monta a moldura inteira aqui dentro (`renderShell()`, no boot do
         `app.js`) — nada de markup fixo além deste ponto de montagem e do toast. -->
    <div id="app"></div>

    <div id="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
